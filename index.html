
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebCraft – Professional Web Design</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#0a0a0f;
color:#f0f0ff;
min-height:100vh
}

nav{
height:75px;
padding:0 8%;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #2a2a3d;
background:#0a0a0f
}

.logo{
font-size:24px;
font-weight:bold;
color:#a78bfa
}

nav button{
background:none;
border:0;
color:#f0f0ff;
font-size:16px;
margin-left:20px;
cursor:pointer
}

nav button:hover{color:#a78bfa}

.page{
display:none;
min-height:calc(100vh - 75px);
padding:70px 8%;
text-align:center
}

.page.active{display:block}

.hero{
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
min-height:calc(100vh - 75px)
}

h1{
font-size:clamp(42px,8vw,76px);
max-width:900px;
line-height:1.05
}

h2{
font-size:42px;
margin-bottom:35px
}

p{
color:#8888aa;
font-size:19px;
max-width:700px;
margin:20px auto
}

.btn{
display:inline-block;
padding:14px 25px;
background:#6c63ff;
color:white;
text-decoration:none;
border:0;
border-radius:10px;
margin:8px;
font-weight:bold;
cursor:pointer
}

.secondary{
background:#1a1a26;
border:1px solid #2a2a3d
}

.stats{
display:flex;
justify-content:center;
gap:50px;
flex-wrap:wrap;
margin-top:50px
}

.stat b{
display:block;
font-size:28px;
color:#a78bfa
}

.stat span{color:#8888aa}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
max-width:1000px;
margin:20px auto
}

.card{
background:#1a1a26;
border:1px solid #2a2a3d;
border-radius:16px;
padding:30px
}

.plan-card{overflow:hidden}

.plan-img{
width:calc(100% + 60px);
height:160px;
object-fit:cover;
margin:-30px -30px 22px;
display:block;
filter:saturate(1.15);
transition:transform .5s ease,filter .5s ease
}

.plan-card:hover .plan-img{
transform:scale(1.08);
filter:saturate(1.35) brightness(1.08)
}

.card p{font-size:16px}

.price{
font-size:40px;
color:#a78bfa;
font-weight:bold;
margin:10px
}

.contact-box{
max-width:600px;
margin:60px auto;
background:#1a1a26;
border:1px solid #2a2a3d;
border-radius:18px;
padding:45px
}

.wa{
display:inline-block;
margin-top:25px;
background:#22d3a0;
color:#07110e;
padding:15px 25px;
border-radius:10px;
text-decoration:none;
font-weight:bold
}
